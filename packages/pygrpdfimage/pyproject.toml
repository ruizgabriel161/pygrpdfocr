[project]
name = "pygrpdfimage"
authors = [
    {name = "ruizgabriel161",email = "ruizgabriel161@outlook.com"}
]
version = "0.1.2"
description = "Biblioteca para converter pdf em imagem" 
dependencies = [
    "pdf2image>=1.17.0",
]


# ============================
# Build e hatchling
# ============================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ['./src/pygrpdfimage']

[tool.ruff]
extend = '../../pyproject.toml'

[tool.pyright]
extends = '../../pyproject.toml'
