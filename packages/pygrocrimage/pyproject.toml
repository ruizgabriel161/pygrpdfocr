[project]
name = "pygrocrimage"
authors = [
    {name = "ruizgabriel161",email = "ruizgabriel161@outlook.com"}
]
version = "0.1.4"
description = "Biblioteca para fazer ocr em imagem" 
dependencies = [
    # ============================
    # dependências principais
    # ============================

    # mantém compatibilidade dentro da major/minor atual
    "langchain~=1.2.15",
    "langchain-google-genai~=4.2",
    "langchain-ollama~=1.1",
    "langchain-openai~=1.2",

    # dependencia interna do monorepo
    # ajuste a versão conforme o release do package
    "pygrpdfimage~=0.1",

    # libs utilitárias
    "python-docx~=1.2",
    "reportlab~=4.5",

    # pandas 3 ainda não existe oficialmente
    # usar ~= evita breaking changes de major version
    "pandas~=2.2",
]

# ============================
# dependencias opcionais
# ============================

[project.optional-dependencies]

openai = [
    "langchain-openai~=1.2",
]

google = [
    "langchain-google-genai~=4.2",
]

ollama = [
    "langchain-ollama~=1.1",
]

anthropic = [
    "langchain-anthropic~=1.4",
]

all = [
    "pygrocrimage[openai,google,ollama,anthropic]",
]

tesseract = [
    "pytesseract~=0.3.13",

    # pillow costuma quebrar menos,
    # então pode deixar sem pin rígido
    "pillow>=10,<13",

    # opencv costuma ter breaking changes frequentes
    "opencv-python~=4.13",

    # pymupdf muda API entre versões maiores
    "pymupdf~=1.27",
]


# ============================
# Build e hatchling
# ============================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ['./src/pygrocrimage']

[tool.ruff]
extend = '../../pyproject.toml'

[tool.pyright]
extends = '../../pyproject.toml'
