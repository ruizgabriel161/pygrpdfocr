[project]
name = "pygrocrimage"
authors = [
    {name = "ruizgabriel161",email = "ruizgabriel161@outlook.com"}
]
version = "0.1.1"
description = "Biblioteca para fazer ocr em imagem" 
dependencies = [
    "langchain>=1.2.15",
    "langchain-google-genai>=4.2.2",
    "langchain-ollama>=1.1.0",
    'pygrocrimage',
    "pytesseract>=0.3.13",
]


# ============================
# Build e hatchling
# ============================

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ['./src/pygrocrimage']

[tool.ruff]
extend = '../../pyproject.toml'

[tool.pyright]
extends = '../../pyproject.toml'
